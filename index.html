<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratnababu World - MR AI</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#222;
}

header{
    text-align:center;
    color:white;
    padding:30px 15px;
}

.card{
    max-width:600px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
}

#answer{
    margin-top:20px;
    padding:15px;
    background:#f1f5f9;
    border-radius:10px;
    min-height:30px;
}
</style>
</head>

<body>

<header>
    <h1>🌍 RW - Ratnababu World</h1>
    <p>Welcome to my official website!</p>
    <p>My name is Ratnababu.</p>
</header>

<div class="card">
    <h2>🤖 MR AI</h2>
    <p>Ask me a question</p>

    <input
        type="text"
        id="question"
        placeholder="Type your question..."
    >

    <button onclick="askAI()">Ask MR AI</button>

    <div id="answer">
        MR AI: Hello! Ask me something. 😊
    </div>
</div>

<script>
function askAI(){

    const question =
        document.getElementById("question").value.trim();

    const answer =
        document.getElementById("answer");

    if(!question){
        answer.innerText =
            "MR AI: Please type a question.";
        return;
    }

    const q = question.toLowerCase();

    if(q.includes("hello") || q.includes("hi")){
        answer.innerText =
            "MR AI: Hello Ratnababu! 👋 Welcome to Ratnababu World.";
    }
    else if(q.includes("name")){
        answer.innerText =
            "MR AI: My name is MR AI. 🤖";
    }
    else if(q.includes("website")){
        answer.innerText =
            "MR AI: This is Ratnababu World website. 🌍";
    }
    else if(q.includes("who are you")){
        answer.innerText =
            "MR AI: I am MR AI, your website assistant. 🤖";
    }
    else if(q.includes("income") || q.includes("money")){
        answer.innerText =
            "MR AI: You can earn from an app using ads, premium features, products or services.";
    }
    else{
        answer.innerText =
            "MR AI: I received your question: " + question +
            " 😊";
    }
}
</script>

</body>
</html>
